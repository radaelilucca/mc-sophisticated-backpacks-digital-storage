plugins {
    id 'net.neoforged.moddev.legacyforge'
}

base {
    archivesName = "${mod_id}-forge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version_common as int)
    withSourcesJar()
}

legacyForge {
    version = "${forge_minecraft_version}-${forge_version}"
    validateAccessTransformers = true

    runs {
        client {
            client()
            gameDirectory = project.file('../runs/forge-client')
        }
        server {
            server()
            gameDirectory = project.file('../runs/forge-server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('../runs/forge-gametest')
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    modCompileOnly 'maven.modrinth:sophisticated-core:e0UoBJSs'
    modCompileOnly 'maven.modrinth:sophisticated-backpacks:X7q2xTaV'
    modCompileOnly 'maven.modrinth:ae2:jYgSnxye'
    modCompileOnly 'maven.modrinth:refined-storage:ZITLFjjf'
    modCompileOnly 'maven.modrinth:toms-storage:XELeoPjZ'
    modRuntimeOnly 'maven.modrinth:sophisticated-core:e0UoBJSs'
    modRuntimeOnly 'maven.modrinth:sophisticated-backpacks:X7q2xTaV'
    // These optional mods are added only for the client launch, so GameTests
    // retain the minimal dedicated-server profile.
    def requestedTasks = gradle.startParameter.taskNames
    if (requestedTasks.any { it.endsWith(':runClient') || it == 'runClient' }) {
        modRuntimeOnly 'maven.modrinth:ae2:jYgSnxye'
        modRuntimeOnly 'maven.modrinth:refined-storage:ZITLFjjf'
        modRuntimeOnly 'maven.modrinth:toms-storage:XELeoPjZ'
        modRuntimeOnly 'org.appliedenergistics:guideme:20.1.7'
    }
    compileOnly 'io.github.llamalad7:mixinextras-forge:0.4.1'
    modCompileOnly 'io.github.llamalad7:mixinextras-forge:0.4.1'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'
    modRuntimeOnly 'io.github.llamalad7:mixinextras-forge:0.4.1'
    compileOnly 'org.appliedenergistics:guideme:20.1.7:api'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Minecraft 1.20.1's Log4j SLF4J bridge requires the SLF4J 2 API, while
    // Gradle's own runtime may otherwise expose an older 1.x API to JUnit.
    testRuntimeOnly 'org.slf4j:slf4j-api:2.0.9'
    // The 1.20.1 test matrix runs inside Forge GameTest; these assertions are
    // called by the GameTest driver, not by JUnit's untransformed JVM runner.
    compileOnly 'org.junit.jupiter:junit-jupiter-api:5.11.4'
    compileOnly 'org.junit.jupiter:junit-jupiter-params:5.11.4'
    runtimeOnly 'org.junit.jupiter:junit-jupiter-api:5.11.4'
    runtimeOnly 'org.junit.jupiter:junit-jupiter-params:5.11.4'
    gameTestServerAdditionalRuntimeClasspath 'org.junit.jupiter:junit-jupiter-api:5.11.4'
    gameTestServerAdditionalRuntimeClasspath 'org.junit.jupiter:junit-jupiter-params:5.11.4'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// Install audited Forge mods into the run's actual `mods` directory. ModDev's
// additional runtime classpath makes jars visible to Java but does not install
// them as Forge mods, which is required for in-game integration testing.
tasks.register('prepareForgeClientMods', Copy) {
    from({ sourceSets.main.runtimeClasspath.filter { it.name in [
            'sophisticated-core-e0UoBJSs.jar',
            'sophisticated-backpacks-X7q2xTaV.jar',
            'ae2-jYgSnxye.jar',
            'refined-storage-ZITLFjjf.jar',
            'toms-storage-XELeoPjZ.jar',
            'guideme-20.1.7.jar'
    ] } })
    into('../runs/forge-client/mods')
    doFirst {
        delete(files('../runs/forge-client/mods/sophisticatedcore-1.20.1-1.5.10.2402.jar',
                '../runs/forge-client/mods/sophisticatedbackpacks-1.20.1-3.26.12.2206.jar',
                '../runs/forge-client/mods/appliedenergistics2-forge-15.4.11.jar',
                '../runs/forge-client/mods/refinedstorage-1.12.4.jar',
                '../runs/forge-client/mods/toms_storage-1.20-1.7.1.jar',
                '../runs/forge-client/mods/ae2-jYgSnxye.jar',
                '../runs/forge-client/mods/refined-storage-ZITLFjjf.jar',
                '../runs/forge-client/mods/toms-storage-XELeoPjZ.jar'))
    }
}

tasks.register('prepareForgeGameTestMods', Copy) {
    from({ sourceSets.main.runtimeClasspath.filter { it.name in [
            'sophisticated-core-e0UoBJSs.jar',
            'sophisticated-backpacks-X7q2xTaV.jar'
    ] } })
    into('../runs/forge-gametest/mods')
}

tasks.named('runClient') {
    dependsOn(tasks.named('prepareForgeClientMods'))
}

tasks.named('runGameTestServer') {
    dependsOn(tasks.named('prepareForgeGameTestMods'))
}

sourceSets.main.java.srcDir('../common/src/main/java')
sourceSets.main.java.srcDir('src/test/java')
sourceSets.test.java.include '**/StorageOperationTest.java'
def sharedResources = tasks.register('prepareSharedForgeResources', Sync) {
    from('../neoforge/src/main/resources') {
        exclude('META-INF/neoforge.mods.toml', 'META-INF/accesstransformer.cfg', 'pack.mcmeta', "${mod_id}.mixins.json")
        eachFile { details ->
            if (details.path.contains('/tags/item/')) {
                details.path = details.path.replace('/tags/item/', '/tags/items/')
            }
        }
    }
    into(layout.buildDirectory.dir('generated/sharedResources'))
    doLast {
        def recipes = fileTree(destinationDir).matching { include('data/**/recipe/*.json') }
        recipes.each { recipeFile ->
            def recipe = new groovy.json.JsonSlurper().parse(recipeFile)
            if (recipe.result instanceof Map && recipe.result.containsKey('id')) {
                recipe.result.item = recipe.result.remove('id')
                recipeFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(recipe)) + '\n'
            }
        }
    }
}
sourceSets.main.resources.srcDir(sharedResources)

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version_common as int
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}
tasks.named('compileTestJava', JavaCompile).configure {
    doFirst { delete destinationDirectory }
}

// ModDevGradle adds the remapped Minecraft/Forge classes directly to main
// compilation tasks. Plain Gradle JUnit tasks do not inherit that classpath,
// so mirror it for the Forge-side tests that exercise Minecraft APIs.
tasks.named('compileTestJava', JavaCompile).configure {
    classpath += tasks.named('compileJava', JavaCompile).get().classpath
}
tasks.named('test', Test).configure {
    classpath += tasks.named('compileJava', JavaCompile).get().classpath
}

tasks.named('jar', Jar).configure {
    // JUnit fixtures and the Forge GameTest driver are compiled into the mod
    // output so the dev server can discover them, but are excluded from jars.
    exclude '**/*Test.class'
    exclude '**/*Tests.class'
    exclude "data/${mod_id}/structures/empty.nbt"
}

processResources {
    dependsOn(sharedResources)
    def properties = [
        version: "${mod_version}+${forge_minecraft_version}",
        mod_id: mod_id,
        mod_name: mod_name,
        mod_description: mod_description,
        mod_authors: mod_authors,
        mod_license: mod_license,
        forge_minecraft_version_range: '[1.20.1,1.20.2)',
        forge_version_range: '[47,)',
        forge_loader_version_range: forge_loader_version_range
    ]
    inputs.properties(properties)
    filesMatching('META-INF/mods.toml') {
        expand(properties)
    }
    filesMatching('pack.mcmeta') {
        expand(properties)
    }
}

tasks.named('jar', Jar).configure {
    manifest.attributes(['MixinConfigs': "${mod_id}.mixins.json"])
}

tasks.register('verifyForgeResources') {
    group = 'verification'
    description = 'Checks the 1.20.1 recipe result format and generated pack metadata.'
    dependsOn(tasks.named('processResources'))
    doLast {
        def resources = layout.buildDirectory.dir('resources/main').get().asFile
        def recipeDir = new File(resources, "data/${mod_id}/recipe")
        ['remote_deposit_upgrade', 'remote_restock_upgrade', 'remote_pickup_upgrade',
         'remote_magnet_upgrade', 'remote_refill_upgrade', 'remote_feeding_upgrade',
         'remote_alchemy_upgrade', 'remote_pump_upgrade'].each { recipeName ->
            def recipeFile = new File(recipeDir, "${recipeName}.json")
            if (!recipeFile.isFile()) {
                throw new GradleException("Missing Forge recipe: ${recipeFile}")
            }
            def recipe = new groovy.json.JsonSlurper().parse(recipeFile)
            if (!(recipe.result instanceof Map) || !recipe.result.item || recipe.result.id) {
                throw new GradleException("Recipe ${recipeName} does not use the Forge 1.20 result format")
            }
        }
        def pack = new groovy.json.JsonSlurper().parse(new File(resources, 'pack.mcmeta'))
        if (pack.pack.pack_format != 15) {
            throw new GradleException('Forge 1.20.1 pack.mcmeta must use pack_format 15')
        }
        if (!new File(resources, "${mod_id}.mixins.json").isFile()) {
            throw new GradleException('Forge Mixin configuration is missing')
        }
        def upgradeTag = new File(resources, 'data/sophisticatedbackpacks/tags/items/upgrade.json')
        if (!upgradeTag.isFile() || new File(resources, 'data/sophisticatedbackpacks/tags/item/upgrade.json').exists()) {
            throw new GradleException('Forge 1.20.1 upgrade tag must use tags/items')
        }
        def mixins = new groovy.json.JsonSlurper().parse(new File(resources, "${mod_id}.mixins.json"))
        ['PickupContextMixin', 'MagnetUpgradeWrapperAccessor', 'ItemEntityPickupDelayAccessor',
         'BackpackFluidCapabilityMixin',
         'AlchemyDefinitionsAccessor'].each { mixin ->
            if (!mixins.mixins.contains(mixin)) throw new GradleException("Required Forge Mixin is missing: ${mixin}")
        }
    }
}

tasks.named('check') {
    dependsOn(tasks.named('verifyForgeResources'))
    dependsOn(tasks.named('runGameTestServer'))
}

