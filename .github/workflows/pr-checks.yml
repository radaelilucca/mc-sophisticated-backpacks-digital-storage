name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate shared, Forge and NeoForge modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check common and Forge 1.20.1
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :common:check :forge:check --no-daemon --no-parallel --console=plain
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build NeoForge 1.21.1
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :neoforge:build --no-daemon --no-parallel --console=plain
