name: Build Sophisticated Backpacks IS Addon release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Newly created semantic tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate tag and build Forge 1.20.1
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          chmod +x ./gradlew
          ./gradlew -Pmod_version="${RELEASE_TAG#v}" :common:check :forge:build --no-daemon --no-parallel --console=plain
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build NeoForge 1.21.1
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew -Pmod_version="${RELEASE_TAG#v}" :neoforge:build --no-daemon --no-parallel --console=plain
      - name: Collect Forge and NeoForge JARs
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mod_id="$(sed -nE 's/^mod_id=([^[:space:]]+)$/\1/p' gradle.properties)"
          mkdir -p release-artifacts
          for loader in forge neoforge; do
            mapfile -t jars < <(find "$loader/build/libs" -maxdepth 1 -type f -name "*-${version}.jar" ! -name '*-sources.jar' -print)
            test "${#jars[@]}" -eq 1
            cp "${jars[0]}" "release-artifacts/${mod_id}-${version}-${loader}.jar"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sophisticated-backpack-is-addon-${{ env.RELEASE_TAG }}
          path: release-artifacts/
          if-no-files-found: error
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --generate-notes --title "Sophisticated Backpacks IS Addon $RELEASE_TAG"
          gh release upload "$RELEASE_TAG" release-artifacts/*.jar --clobber
