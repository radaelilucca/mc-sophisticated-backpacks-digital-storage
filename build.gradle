plugins {
    id 'net.neoforged.moddev' version '2.0.144'
}

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_id}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
            gameDirectory = project.file('runs/client')
            programArgument '--quickPlaySingleplayer'
            programArgument 'New World'
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods[mod_id]
    }
}

// Optional storage mods are available only in the local development runtime.
// Their JARs are kept out of the published addon and are ignored by Git.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly 'io.github.llamalad7:mixinextras-neoforge:0.5.3'
    localRuntime 'io.github.llamalad7:mixinextras-neoforge:0.5.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Exercise the common layer without optional storage mods installed.
    testImplementation files(
        'libs/sophisticatedcore-1.21.1-1.5.1.2341.jar',
        'libs/sophisticatedbackpacks-1.21.1-3.26.3.2158.jar'
    )
    [
        'libs/sophisticatedcore-1.21.1-1.5.1.2341.jar',
        'libs/sophisticatedbackpacks-1.21.1-3.26.3.2158.jar',
        'libs/appliedenergistics2-19.2.18.jar',
        'libs/refinedstorage-neoforge-2.0.9.jar',
        'libs/toms_storage-1.21-2.4.2.jar'
    ].each { jarPath ->
        def localMod = files(jarPath)
        compileOnly localMod
        localRuntime localMod
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

processResources {
    def properties = [
        version: "${mod_version}+${minecraft_version}",
        mod_id: mod_id,
        mod_name: mod_name,
        mod_description: mod_description,
        mod_authors: mod_authors,
        mod_license: mod_license,
        minecraft_version: minecraft_version,
        neoforge_version: neoforge_version,
        neoforge_loader_version_range: neoforge_loader_version_range
    ]
    inputs.properties(properties)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(properties)
    }
    filesMatching('pack.mcmeta') {
        expand(properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}
