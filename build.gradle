plugins {
    id 'base'
    id 'net.neoforged.moddev' version '2.0.144' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.144' apply false
}

group = mod_group_id
version = mod_version

allprojects {
    group = mod_group_id
    version = mod_version

    repositories {
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Modrinth'
                    url = 'https://api.modrinth.com/maven'
                }
            }
            filter {
                includeGroup 'maven.modrinth'
            }
        }
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Checks the shared core and builds the Forge 1.20.1 and NeoForge 1.21.1 artifacts.'
    dependsOn(':common:check', ':forge:build', ':neoforge:build')
}

tasks.named('build') {
    dependsOn(':common:check', ':forge:build', ':neoforge:build')
}
